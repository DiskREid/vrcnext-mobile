<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Authentication appearance synthetic transport fixture only</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { Capacitor, registerPlugin } from '@capacitor/core';
      import '/src/styles.css';
      const self = {
        id: 'usr_aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
        displayName: 'Auth Explorer',
        state: 'offline',
        location: 'offline',
        status: 'active',
        friends: [],
      };
      let pending = new URLSearchParams(location.search).get('saved') === 'pending';
      let authenticated = new URLSearchParams(location.search).get('saved') === 'verified';
      const listeners = new Map(),
        appListeners = new Map();
      const test = (window.__authAppearanceTest = {
        ready: false,
        requests: [],
        unexpected: [],
        clears: 0,
        sessionReads: 0,
        externalLinks: [],
      });
      const bridge = {
        async sessionState() {
          test.sessionReads++;
          return { hasAuth: pending || authenticated };
        },
        async request(options) {
          const url = new URL(options.path, 'https://synthetic.invalid');
          test.requests.push({
            path: options.path,
            method: options.method || 'GET',
            hasAuthorization: !!options.authorization,
          });
          if (url.pathname === '/auth/user') {
            if (options.authorization) pending = true;
            return authenticated
              ? { status: 200, data: self }
              : pending
                ? { status: 200, data: { requiresTwoFactorAuth: ['emailOtp', 'totp', 'otp'] } }
                : { status: 401, data: {} };
          }
          if (url.pathname === '/auth/twofactorauth/emailotp/verify') {
            if (pending && JSON.parse(options.body).code === '123456') {
              authenticated = true;
              pending = false;
              return { status: 200, data: { verified: true } };
            }
            return { status: 401, data: {} };
          }
          if (url.pathname === `/users/${self.id}`) return { status: 200, data: self };
          if (url.pathname === `/profile/${self.id}`)
            return { status: 200, data: { id: self.id, bio: '' } };
          if (
            [
              '/auth/user/friends',
              '/favorites',
              '/calendar',
              '/worlds',
              `/users/${self.id}/groups`,
            ].includes(url.pathname)
          )
            return { status: 200, data: [] };
          test.unexpected.push(options.path);
          return {
            status: 500,
            data: { error: { message: 'Unexpected synthetic auth appearance route' } },
          };
        },
        async clearSession() {
          test.clears++;
          pending = false;
          authenticated = false;
        },
        async setLauncherIcon({ holiday }) {
          return { icon: holiday || 'standard', changed: true };
        },
        async addListener(name, callback) {
          listeners.set(name, callback);
          return { remove: async () => listeners.delete(name) };
        },
        async connectPipeline() {
          listeners.get('connection')?.({ state: 'connected' });
        },
        async disconnectPipeline() {},
        async screenProtection() {
          return { enabled: false };
        },
        async setScreenProtection({ enabled }) {
          return { enabled };
        },
        async openLink({ url }) {
          test.externalLinks.push(url);
        },
      };
      const appBridge = {
        getState: async () => ({ isActive: true }),
        addListener: async (name, callback) => {
          if (!appListeners.has(name)) appListeners.set(name, new Set());
          appListeners.get(name).add(callback);
          return { remove: async () => appListeners.get(name)?.delete(callback) };
        },
        exitApp: async () => {},
      };
      registerPlugin('VrcNative', { web: () => bridge, android: () => bridge });
      registerPlugin('App', { web: () => appBridge, android: () => appBridge });
      Capacitor.getPlatform = () => 'android';
      Capacitor.isNativePlatform = () => true;
      const { appearanceStore } = await import('/src/data/appearance.ts');
      test.setAppearance = appearanceStore.updateSettings;
      const { default: App } = await import('/src/App.tsx');
      createRoot(document.getElementById('root')).render(React.createElement(App));
      test.ready = true;
    </script>
  </body>
</html>
