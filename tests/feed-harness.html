<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed profile history synthetic transport fixture only</title></head>
<body><div id="root"></div><script type="module">
// This isolated test entry renders the real App, API client, scheduler and IndexedDB journal.
// Mutable server snapshots below are synthetic. No fabricated HistoryEvent is injected.
import React from 'react';
import {createRoot} from 'react-dom/client';
import {Capacitor,registerPlugin} from '@capacitor/core';
import '/src/styles.css';
const picture='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const selfId='usr_feed-self',friendId='usr_feed-friend';
const initial={id:friendId,displayName:'Synthetic Feed Friend',bio:'Привет 👋\nИграю в 22:22',currentAvatar:'avtr_feed-old',currentAvatarName:'Старый Лис',currentAvatarAuthorName:'Synthetic Avatar Author',currentAvatarImageUrl:'https://api.vrchat.cloud/api/1/file/file_feed-old/1/file',currentAvatarThumbnailImageUrl:'https://api.vrchat.cloud/api/1/image/file_feed-old/1/256'};
let saved;
try{saved=JSON.parse(sessionStorage.getItem('synthetic-feed-server')||'null');}catch{}
let profile={...initial,...saved?.profile};
let listImage=saved?.listImage||initial.currentAvatarImageUrl;
const persist=()=>sessionStorage.setItem('synthetic-feed-server',JSON.stringify({profile,listImage}));
const self={id:selfId,displayName:'Synthetic Feed Self',state:'offline',location:'offline',status:'active',friends:[friendId],activeFriends:[friendId],onlineFriends:[],offlineFriends:[]};
const friend=()=>({id:friendId,displayName:'Synthetic Feed Friend',location:'offline',status:'active',isFriend:true,tags:[],currentAvatarImageUrl:listImage});
const pipelineListeners=new Map(),appListeners=new Set();
let active=true,nextFailure,holdNext=false,releaseHeld;
const fixture=window.__feedTest={selfId,friendId,requests:[],profileReplies:[],searches:[],unexpected:[],connected:false,held:false,
 changeProfile:(change)=>{profile={...profile,...change};persist();},
 emitAvatar:()=>{listImage=profile.currentAvatarImageUrl;persist();pipelineListeners.get('pipeline')?.({type:'friend-update',content:{userId:friendId,user:{id:friendId,displayName:'Synthetic Feed Friend',currentAvatarImageUrl:listImage}}});},
 emitSignal:()=>pipelineListeners.get('pipeline')?.({type:'friend-update',content:{userId:friendId,user:{id:friendId,displayName:'Synthetic Feed Friend'}}}),
 failNextProfile:(status=503,retryAfter)=>{nextFailure={status,retryAfter};},
 holdNextProfile:()=>{holdNext=true;},releaseProfile:()=>releaseHeld?.(),
 setActive:(value)=>{active=value;for(const listener of appListeners)listener({isActive:value});},
 stored:async()=>new Promise((resolve,reject)=>{const request=indexedDB.open('vrcnext-mobile-history',2);request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('events','readonly');const rows=tx.objectStore('events').index('accountTime').getAll(IDBKeyRange.bound([selfId,''],[selfId,'\uffff']));rows.onsuccess=()=>{resolve(rows.result);db.close();};rows.onerror=()=>{reject(rows.error);db.close();};};}),
};
const bridge={
 async sessionState(){return{hasAuth:true};},
 async request(options){
  const method=options.method||'GET',url=new URL(options.path,'https://synthetic.invalid');
  fixture.requests.push({path:options.path,method,time:Date.now()});
  if(url.pathname==='/auth/user')return{status:200,data:self};
  if(url.pathname==='/auth/user/friends')return{status:200,data:url.searchParams.get('offline')==='false'?[friend()]:[]};
  if(url.pathname===`/users/${friendId}`)return{status:200,data:{...friend(),state:'active'}};
  if(url.pathname===`/users/${selfId}`)return{status:200,data:self};
  if(url.pathname===`/profile/${friendId}`){
   const value={...profile};
   if(holdNext){holdNext=false;fixture.held=true;await new Promise(resolve=>{releaseHeld=resolve;});fixture.held=false;}
   if(nextFailure){const failure=nextFailure;nextFailure=undefined;return{...failure,data:{error:{message:'Synthetic public profile unavailable'}}};}
   fixture.profileReplies.push({time:Date.now(),bio:value.bio});return{status:200,data:value};
  }
  if(url.pathname==='/favorites')return{status:200,data:[]};
  if(url.pathname==='/calendar'||url.pathname===`/users/${selfId}/groups`)return{status:200,data:[]};
  fixture.unexpected.push(options.path);return{status:500,data:{error:{message:'Unexpected synthetic feed route'}}};
 },
 async searchPublicAvatars(options){fixture.searches.push({...options,time:Date.now()});return{status:200,data:[{vrc_id:profile.currentAvatar,name:profile.currentAvatarName,author:{name:profile.currentAvatarAuthorName,vrc_id:'usr_feed-author'},image_url:profile.currentAvatarImageUrl}]};},
 async addListener(name,listener){pipelineListeners.set(name,listener);return{remove:async()=>{if(pipelineListeners.get(name)===listener)pipelineListeners.delete(name);}};},
 async connectPipeline(){fixture.connected=true;pipelineListeners.get('connection')?.({state:'connected'});},
 async disconnectPipeline(){},async clearSession(){},async loadImage(){return{dataUrl:picture};},
 async openLink(){},async copyText(){},async exportJson(){return{saved:true};},
};
registerPlugin('VrcNative',{web:()=>bridge});
registerPlugin('App',{web:()=>({getState:async()=>({isActive:active}),addListener:async(name,listener)=>{if(name==='appStateChange')appListeners.add(listener);return{remove:async()=>appListeners.delete(listener)};},exitApp:async()=>{}})});
Capacitor.isNativePlatform=()=>true;
const {default:App}=await import('/src/App.tsx');
createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
