<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar transition event synthetic transport fixture only</title></head>
<body><div id="root"></div><script type="module">
// Real App, native API adapter, event detection and IndexedDB use synthetic responses.
// Avatar candidates enter only through emitted WS fields; only the legacy repair test seeds old rows.
import React from 'react';
import {createRoot} from 'react-dom/client';
import {Capacitor,registerPlugin} from '@capacitor/core';
import '/src/styles.css';
const picture=color=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="12" fill="${color}"/><circle cx="40" cy="31" r="14" fill="#eeeaff"/><path d="M16 73c0-24 48-24 48 0" fill="#eeeaff"/></svg>`);
const selfId='usr_feed-self',friendId='usr_feed-friend';
const oldFile='file_11111111-1111-4111-8111-111111111111',newFile='file_22222222-2222-4222-8222-222222222222',otherFile='file_33333333-3333-4333-8333-333333333333',fileOnlyFile='file_44444444-4444-4444-8444-444444444444',customFile='file_55555555-5555-4555-8555-555555555555';
const image=file=>`https://api.vrchat.cloud/api/1/file/${file}/1/file`;
const thumbnail=file=>`https://api.vrchat.cloud/api/1/image/${file}/1/256`;
const avatars={
 [oldFile]:{vrc_id:'avtr_feed-old',name:'Старый Лис',author:{name:'Synthetic Avatar Author',vrc_id:'usr_feed-author'},image_url:image(oldFile)},
 [newFile]:{vrc_id:'avtr_feed-new',name:'Лунный Лис',author:{name:'Synthetic Moon Author',vrc_id:'usr_feed-author'},image_url:image(newFile)},
 [otherFile]:{vrc_id:'avtr_feed-other',name:'Солнечный Лис',author:{name:'Synthetic Sun Author',vrc_id:'usr_feed-author'},image_url:image(otherFile)},
 [fileOnlyFile]:{vrc_id:'avtr_feed-file-only',name:'Официальный Лис',author:{name:'Synthetic File Author',vrc_id:'usr_feed-author'},image_url:image(fileOnlyFile)},
};
const initial={trustTags:['system_trust_known'],id:friendId,displayName:'Synthetic Feed Friend',bio:'Привет 👋\nИграю в 22:22',currentAvatar:'avtr_feed-old',currentAvatarName:'Старый Лис',currentAvatarAuthorName:'Synthetic Avatar Author',currentAvatarImageUrl:image(oldFile),currentAvatarThumbnailImageUrl:thumbnail(oldFile)};
let saved;
try{saved=JSON.parse(sessionStorage.getItem('synthetic-feed-server')||'null');}catch{}
let profile={...initial,...saved?.profile};
let listImage=saved?.listImage||initial.currentAvatarImageUrl;
const baselineThumbnail=new URLSearchParams(location.search).get('baseline')==='thumbnail';
const modes=new Map([[fileOnlyFile,'file'],[customFile,'custom']]);
const persist=()=>sessionStorage.setItem('synthetic-feed-server',JSON.stringify({profile,listImage}));
const self={id:selfId,displayName:'Synthetic Feed Self',state:'offline',location:'offline',status:'active',friends:[friendId],activeFriends:[friendId],onlineFriends:[],offlineFriends:[]};
const friend=()=>({id:friendId,displayName:'Synthetic Feed Friend',location:'offline',status:'active',isFriend:true,tags:[],...(baselineThumbnail?{currentAvatarThumbnailImageUrl:thumbnail(listImage.match(/(file_[a-zA-Z0-9_-]+)/)?.[1]||oldFile)}:{currentAvatarImageUrl:listImage})});
const pipelineListeners=new Map(),appListeners=new Set();
let active=true,nextResolveFailure,holdNext=false,releaseHeld;
const fileFrom=user=>[user.currentAvatarImageUrl,user.currentAvatarThumbnailImageUrl,user.iconUrl].find(value=>typeof value==='string')?.match(/(file_[a-zA-Z0-9_-]+)/)?.[1];
function emitUpdate(user={}) {
 const file=fileFrom(user),avatar=file&&avatars[file];
 if(avatar){profile={...profile,currentAvatar:avatar.vrc_id,currentAvatarName:avatar.name,currentAvatarAuthorName:avatar.author.name,currentAvatarImageUrl:avatar.image_url,currentAvatarThumbnailImageUrl:thumbnail(file)};listImage=avatar.image_url;}
 profile={...profile,...user};persist();
 pipelineListeners.get('pipeline')?.({type:'friend-update',content:{userId:friendId,user:{id:friendId,displayName:'Synthetic Feed Friend',...user}}});
}
const fixture=window.__feedTest={selfId,friendId,oldFile,newFile,otherFile,fileOnlyFile,customFile,oldImage:image(oldFile),newImage:image(newFile),otherImage:image(otherFile),oldThumbnail:thumbnail(oldFile),newThumbnail:thumbnail(newFile),fileOnlyImage:image(fileOnlyFile),customImage:image(customFile),requests:[],resolves:[],searches:[],unexpected:[],connected:false,held:false,
 emitUpdate,
 emitEvent:(type,user={})=>pipelineListeners.get('pipeline')?.({type,content:{userId:friendId,user:{id:friendId,displayName:'Synthetic Feed Friend',...user}}}),
 emitConnection:state=>{fixture.connected=state==='connected';pipelineListeners.get('connection')?.({state});},
 changeProfile:change=>{profile={...profile,...change};persist();},
 setResolveMode:(fileId,mode)=>modes.set(fileId,mode),
 failNextResolve:(status=503,retryAfter)=>{nextResolveFailure={status,retryAfter};},
 holdNextResolve:()=>{holdNext=true;},releaseResolve:()=>releaseHeld?.(),
 setActive:value=>{active=value;for(const listener of appListeners)listener({isActive:value});},
 seedStored:async(events)=>new Promise((resolve,reject)=>{const request=indexedDB.open('vrcnext-mobile-history',2);request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('events','readwrite');for(const event of events)tx.objectStore('events').put({...event,account:selfId});tx.oncomplete=()=>{resolve();db.close();};tx.onabort=tx.onerror=()=>{reject(tx.error);db.close();};};}),
 stored:async()=>new Promise((resolve,reject)=>{const request=indexedDB.open('vrcnext-mobile-history',2);request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('events','readonly');const rows=tx.objectStore('events').index('accountTime').getAll(IDBKeyRange.bound([selfId,''],[selfId,'\uffff']));rows.onsuccess=()=>{resolve(rows.result);db.close();};rows.onerror=()=>{reject(rows.error);db.close();};};}),
};
const bridge={
 async sessionState(){return{hasAuth:true};},
 async request(options){
  const method=options.method||'GET',url=new URL(options.path,'https://synthetic.invalid');
  fixture.requests.push({path:options.path,method,time:Date.now()});
  if(url.pathname==='/auth/user')return{status:200,data:self};
  if(url.pathname==='/auth/user/friends')return{status:200,data:url.searchParams.get('offline')==='false'?[friend()]:[]};
  if(url.pathname===`/users/${friendId}`)return{status:200,data:{...friend(),state:'active'}};
  if(url.pathname===`/users/${selfId}`)return{status:200,data:self};
  if(url.pathname===`/profile/${friendId}`)return{status:200,data:{...profile}};
  if(url.pathname.startsWith('/file/')){
   const fileId=url.pathname.slice('/file/'.length),mode=modes.get(fileId)||'avtrdb',avatar=avatars[fileId];
   if(mode==='failure')return{status:503,data:{error:{message:'Synthetic file unavailable'}}};
   if(mode==='custom')return{status:200,data:{id:fileId,name:'User Icon - Synthetic Custom Picture',ownerId:'usr_feed-author'}};
   if(avatar)return{status:200,data:{id:fileId,name:`Avatar - ${avatar.name} - Image - Unity 2022`,ownerId:'usr_feed-author'}};
   return{status:404,data:{error:{message:'Synthetic file not found'}}};
  }
  if(url.pathname==='/favorites')return{status:200,data:[]};
  if(url.pathname==='/calendar'||url.pathname===`/users/${selfId}/groups`)return{status:200,data:[]};
  fixture.unexpected.push(options.path);return{status:500,data:{error:{message:'Unexpected synthetic feed route'}}};
 },
 async resolvePublicAvatar(options){
  const source=options.source||'avtrdb';fixture.resolves.push({...options,source,time:Date.now()});
  if(holdNext){holdNext=false;fixture.held=true;await new Promise(resolve=>{releaseHeld=resolve;});fixture.held=false;}
  if(nextResolveFailure){const failure=nextResolveFailure;nextResolveFailure=undefined;return{...failure,data:{error:{message:'Synthetic avatar resolve unavailable'}}};}
  const mode=modes.get(options.fileId)||'avtrdb',avatar=avatars[options.fileId];
  if(mode==='failure')return{status:503,data:{error:{message:'Synthetic avatar resolve unavailable'}}};
  if(!avatar||mode==='file'||mode==='custom'||mode==='icu'&&source==='avtrdb')return{status:200,data:{}};
  const result=source==='icu'?{id:avatar.vrc_id,name:avatar.name,authorName:avatar.author.name,authorId:avatar.author.vrc_id,imageUrl:avatar.image_url}:avatar;
  return{status:200,data:{[options.fileId]:result}};
 },
 async searchPublicAvatars(options){fixture.searches.push({...options,time:Date.now()});const avatar=Object.values(avatars).find(value=>value.name===options.query||value.vrc_id===options.query);return{status:200,data:avatar?[avatar]:[]};},
 async addListener(name,listener){pipelineListeners.set(name,listener);return{remove:async()=>{if(pipelineListeners.get(name)===listener)pipelineListeners.delete(name);}};},
 async connectPipeline(){fixture.connected=true;pipelineListeners.get('connection')?.({state:'connected'});},
 async disconnectPipeline(){},async clearSession(){},async loadImage(options){return{dataUrl:picture(options.url.includes(newFile)?'#357e85':'#7052a8')};},
 async openLink(){},async copyText(){},async exportJson(){return{saved:true};},
};
registerPlugin('VrcNative',{web:()=>bridge});
registerPlugin('App',{web:()=>({getState:async()=>({isActive:active}),addListener:async(name,listener)=>{if(name==='appStateChange')appListeners.add(listener);return{remove:async()=>appListeners.delete(listener)};},exitApp:async()=>{}})});
Capacitor.isNativePlatform=()=>true;
const {default:App}=await import('/src/App.tsx');
createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
