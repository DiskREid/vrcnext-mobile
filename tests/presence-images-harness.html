 if(options.path===`/users/${userId}`)return{status:200,data:initial};

},sessionState:async()=>({hasAuth:false}),clearSession:async()=>{},disconnectPipeline:async()=>{}};

 return React.createElement(AppProvider,{value},React.createElement('div',{className:'app-shell'},React.createElement('main',{className:'main-content'},
